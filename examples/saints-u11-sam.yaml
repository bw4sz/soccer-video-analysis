# Saints U11 vs OVF — SAM (Segment Anything Model) for player detection
#
# SAM is a foundation model that segments any visible object without fine-tuning.
# Ideal for overhead cameras where players have high visual contrast with turf.
#
# Trade: ~0.5s per frame (vs RF-DETR ~0.1s) but cleaner segmentation masks
#        → better team color sampling → improved event classification

detector:
  type: sam  # Use SAM for player detection (RF-DETR still used for ball)
