# Saints U11 vs OVF — SAM3 text-prompted player detection + tracking
#
# SAM3's video model does promptable concept segmentation: the text prompt
# below detects, segments AND tracks every matching instance, returning a
# persistent object id per player. It replaces both the player detector and
# the separate ByteTrack pass.
#
# Validated (jobs 37864846 / 37872201) on a 48-frame live clip:
#   20-22 players/frame, 22 ids, 21 stable across >=50% of frames,
#   1.15 s/frame  (RF-DETR found 5-6 players; the old SAM-v1 path found 0)
#
# SAM3 finds people anywhere, so the field-mask/spectator filter still runs
# after tracking to drop coaches, subs and spectators past the touchline.

detector:
  type: sam3
  prompt: "soccer player"
  # SAM3 also tracks the ball far better than RF-DETR on this footage
  # (job 37883252, same 300 sampled frames):
  #   RF-DETR          71% detected, median jump 117px, p95 1260px
  #   SAM3 soccer ball 66% detected, median jump  24px, p95  208px
  # The lower detection rate is a win — RF-DETR's extra 5% were false
  # positives in the trees. Set to null to fall back to RF-DETR.
  ball_prompt: "soccer ball"
