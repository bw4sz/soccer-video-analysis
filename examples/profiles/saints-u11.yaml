team_name: "Saints U11"
season: "2026"
profile_id: "saints-u11"

# Saints run two kits this season: black (away) and white (home).
kits:
  - black   # away
  - white   # home

# `nickname` is optional. It replaces the first name in the Label Studio label
# list `enroll --dump-frames` writes — annotators click what the squad actually
# calls someone — and enrolment maps it back, so the gallery stays keyed by the
# full name and `--player Si` / `--player Simon` / `--number 6` all agree.
roster:
  - name: Simon Weinstein
    nickname: Si
    jersey: 6

claude:
  enabled: true
